require:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "spec/spec_helper.rb"

# --- Style ---
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

# --- Metrics (small tool; favor clarity) ---
Metrics/AbcSize:
  Max: 40

Metrics/MethodLength:
  Max: 35

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 13

Metrics/ClassLength:
  Max: 150
  Exclude:
    - "lib/do/cli.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  Max: 9

# --- Layout ---
Layout/LineLength:
  Max: 105

# --- Naming ---
# `is_thor_reserved_word?` is Thor's own API hook and cannot be renamed.
Naming/PredicatePrefix:
  AllowedMethods: [is_thor_reserved_word?]

Naming/PredicateMethod:
  AllowedMethods: [validate!]

Naming/MethodParameterName:
  AllowedNames:
    - sd
    - t
    - l
    - x
    - ok

# --- RSpec ---
RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/ExampleLength:
  Max: 15
